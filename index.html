function spawn(){const r=Math.random(),t=wave>=3&&r<.1?2:wave>=2&&r<.38?1:0,Y=[{hp:3,sp:2.5,dm:8,sc:1,sk:'#79a866',pts:10},{hp:2,sp:4.4,dm:6,sc:.9,sk:'#b9705f',pts:15},{hp:14,sp:1.7,dm:18,sc:1.6,sk:'#5f8a58',pts:50}][t];
 const a=Math.random()*6.283,rr=22+Math.random()*6,x=clamp(P.x+Math.sin(a)*rr,-38,38),z=clamp(P.z+Math.cos(a)*rr,-38,38);
 const m=human({g:Math.random()<.5?'m':'f',shirt:pick(ZS),hair:'#1c1c1c',sk:Y.sk},true,Y.sc);S.add(m.g);
 E.push({m,x,z,hp:Y.hp*(1+wave*.07),sp:Y.sp*(.9+Math.random()*.2),dmg:Y.dm,r:.6*Y.sc,cd:0,pts:Y.pts})}
function shoot(){const n=wave>=6?3:wave>=3?2:1;for(let i=0;i<n;i++){const a=P.ang+(n==1?0:(i-(n-1)/2)*.16)+(Math.random()-.5)*.05,m=new THREE.Mesh(bg,bmat);m.position.set(P.x+Math.sin(a)*1.2,1.5,P.z+Math.cos(a)*1.2);m.rotation.y=a;S.add(m);Bu.push({m,vx:Math.sin(a)*36,vz:Math.cos(a)*36,l:1.1})}
 mflash.position.set(P.x+Math.sin(P.ang)*1.4,1.6,P.z+Math.cos(P.ang)*1.4);mflash.intensity=3;snd(520+Math.random()*80,.08,'square',.025)}
function hurt(d){P.hp-=d;shake=.45;const h=$('hurt');h.style.opacity=1;setTimeout(()=>h.style.opacity=0,70);snd(110,.15,'sawtooth',.06);if(P.hp<=0){P.hp=0;gameOver()}}
function step(dt){
 let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),mz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(st.l.id!==null){mx+=st.l.dx;mz+=st.l.dy}
 const ml=Math.hypot(mx,mz);if(ml>1){mx/=ml;mz/=ml}
 P.x=clamp(P.x+mx*7*dt,-38.5,38.5);P.z=clamp(P.z+mz*7*dt,-38.5,38.5);push(P,.5);
 let fire=false;
 if(st.r.id!==null){if(Math.hypot(st.r.dx,st.r.dy)>.2){P.ang=Math.atan2(st.r.dx,st.r.dy);fire=true}}
 else if(hasMouse){rc.setFromCamera(mouse,cam);if(rc.ray.intersectPlane(plane,pt3))P.ang=Math.atan2(pt3.x-P.x,pt3.z-P.z);fire=mdown||keys[' ']}
 else if(ml>.1&&!touchDev)P.ang=Math.atan2(mx,mz);
 if(!fire&&!hasMouse&&st.r.id===null&&(cfg.d===0||keys[' '])){let bd=15,be=null;for(const e of E){const d=Math.hypot(e.x-P.x,e.z-P.z);if(d<bd){bd=d;be=e}}if(be){P.ang=Math.atan2(be.x-P.x,be.z-P.z);fire=true}}
 P.cd-=dt;if(fire&&P.cd<=0){P.cd=.17;shoot()}mflash.intensity=Math.max(0,mflash.intensity-dt*30);
 const mv=Math.min(1,ml);pm.g.position.set(P.x,0,P.z);pm.g.rotation.y=P.ang;pm.legs[0].rotation.x=Math.sin(T*11)*.8*mv;pm.legs[1].rotation.x=-Math.sin(T*11)*.8*mv;pm.g.position.y=Math.abs(Math.sin(T*11))*.06*mv;
 if(toSpawn>0){spawnT-=dt;if(spawnT<=0){spawnT=Math.max(.3,.9/dd.c-wave*.03);spawn();toSpawn--}}
 else if(!E.length&&!waveDone){waveDone=true;score+=wave*100;P.hp=Math.min(P.max,P.hp+25);wave++;nextT=3;save();banner(`第 ${wave-1} 波完成！已自動存檔`)}
 if(waveDone){nextT-=dt;if(nextT<=0)startWave(wave)}
 for(const b of Bu){b.m.position.x+=b.vx*dt;b.m.position.z+=b.vz*dt;b.l-=dt;
  for(const e of E){if(e.dead)continue;const dx=b.m.position.x-e.x,dz=b.m.position.z-e.z;if(dx*dx+dz*dz<(e.r+.3)**2){b.l=0;e.hp--;e.x+=b.vx*.012;e.z+=b.vz*.012;burst(e.x,1.5,e.z,4);snd(200,.06,'triangle',.03);
   if(e.hp<=0){e.dead=true;score+=e.pts;kills++;burst(e.x,1.2,e.z,12);snd(90,.2,'sawtooth',.05);if(Math.random()<.13){const m=new THREE.Mesh(kg,kmat);m.position.set(e.x,.6,e.z);S.add(m);Pk.push({m,x:e.x,z:e.z})}}break}}}
 Bu=Bu.filter(b=>{if(b.l>0)return true;S.remove(b.m);return false});
 E=E.filter(e=>{if(!e.dead)return true;S.remove(e.m.g);return false});
 for(let i=0;i<E.length;i++){const e=E[i],dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz)||1;
  e.x+=dx/d*e.sp*dt*dd.es;e.z+=dz/d*e.sp*dt*dd.es;
  for(let j=i+1;j<E.length;j++){const f=E[j],ax=e.x-f.x,az=e.z-f.z,ad=Math.hypot(ax,az),mn=e.r+f.r;if(ad<mn&&ad>0){const p=(mn-ad)/2;e.x+=ax/ad*p;e.z+=az/ad*p;f.x-=ax/ad*p;f.z-=az/ad*p}}
  push(e,e.r);e.m.g.position.set(e.x,0,e.z);e.m.g.rotation.y=Math.atan2(dx,dz);
  const w=Math.sin(T*8+i)*.7;e.m.legs[0].rotation.x=w;e.m.legs[1].rotation.x=-w;e.m.arms[0].rotation.x=e.m.arms[1].rotation.x=-1.4+Math.sin(T*5+i)*.15;
  e.cd-=dt;if(d<e.r+.8&&e.cd<=0&&state==='play'){e.cd=.9;hurt(e.dmg*dd.d)}}
 for(const k of Pk){k.m.rotation.y+=dt*2;k.m.position.y=.7+Math.sin(T*3)*.15;if(Math.hypot(k.x-P.x,k.z-P.z)<1.5){k.got=true;P.hp=Math.min(P.max,P.hp+25);snd(700,.2,'sine',.05);banner('+25 生命')}}
 Pk=Pk.filter(k=>{if(!k.got)return true;S.remove(k.m);return false});
 for(const p of Pa){p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;p.vy-=15*dt;p.l-=dt;p.m.scale.setScalar(Math.max(.01,p.l*2))}
 Pa=Pa.filter(p=>{if(p.l>0&&p.m.position.y>0)return true;S.remove(p.m);return false});
 $('hpb').style.width=P.hp/P.max*100+'%';$('hpt').textContent=Math.ceil(P.hp)+' / '+P.max;$('wv').textContent=`第 ${wave} 波・剩 ${E.length+toSpawn}`;$('sc').textContent=score+' 分';
}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-(loop.l||now))/1000);loop.l=now;T+=dt;
 if(state==='menu'){pm.g.rotation.y=T*.7;pm.legs.forEach(l=>l.rotation.x=0)}
 else{if(state==='play')step(dt);
  const k=innerWidth<innerHeight?1.4:1;shake=Math.max(0,shake-dt*1.5);
  cam.position.lerp(new THREE.Vector3(P.x,15*k,P.z+11*k),Math.min(1,dt*6));cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;cam.lookAt(P.x,.5,P.z);
  moon.position.set(P.x-20,40,P.z+15);moon.target.position.set(P.x,0,P.z)}
 R.render(S,cam)}
resize();rebuild();ui();menuCam();moon.position.set(-20,40,15);requestAnimationFrame(loop);
</script></body></html>
